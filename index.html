function spawnHeartBurst(x,y){
  const count=9;
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='heart-burst-particle';
    el.innerHTML=ICONS.heartFilled;
    const size=9+Math.random()*11;
    el.style.width=size+'px'; el.style.height=size+'px';
    el.style.left=x+'px'; el.style.top=y+'px';
    const angle=(Math.PI*2*i/count)+(Math.random()*0.6-0.3);
    const dist=26+Math.random()*34;
    el.style.setProperty('--tx',(Math.cos(angle)*dist)+'px');
    el.style.setProperty('--ty',(Math.sin(angle)*dist-24)+'px');
    el.style.setProperty('--rot',(Math.random()*70-35)+'deg');
    el.style.animationDelay=(Math.random()*80)+'ms';
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}
function handleGlobalClick(e){
  const el=e.target.closest('[data-action]');
  if(!el) return;
  if(el.dataset.action==='toggle-fav'){
    const wasFav=state.favorites.has(el.dataset.id);
    if(!wasFav){
      const r=el.getBoundingClientRect();
      spawnHeartBurst(r.left+r.width/2,r.top+r.height/2);
      el.classList.remove('heart-pop'); void el.offsetWidth; el.classList.add('heart-pop');
      el.addEventListener('animationend',function once(){ el.classList.remove('heart-pop'); el.removeEventListener('animationend',once); });
    }
  }
  const fn=ACTIONS[el.dataset.action];
  if(fn) fn(el.dataset.id,el.dataset.context);
}
function handleLibrarySearchInput(e){
  if(e.target.id!=='library-search') return;
  const cursorPos=e.target.selectionStart;
  state.searchQuery=e.target.value;
  renderCurrentView();
  const el=document.getElementById('library-search');
  if(el){ el.focus(); el.setSelectionRange(cursorPos,cursorPos); }

function onAudioPlay(){
  state.isPlaying=true;
  document.querySelectorAll('[data-action="playpause"]').forEach(b=>b.innerHTML=ICONS.pause);
  const wrap=document.getElementById('full-cover-wrap'); if(wrap) wrap.classList.add('is-playing');
  if('mediaSession' in navigator) navigator.mediaSession.playbackState='playing';
  ensureAudioGraph();
  if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
  if(pipContainer&&pipContainer._playBtn) pipContainer._playBtn.innerHTML=ICONS.pause;
  requestWakeLock();
  broadcastSync('playpause',{isPlaying:true, trackId: currentTrack?currentTrack.id:null});
  if(!historyLogged&&currentTrack){
    state.history.unshift({trackId:currentTrack.id,playedAt:Date.now()});
    if(state.history.length>200) state.history.length=200;
    historyLogged=true;
    if(state.view==='history') renderCurrentView();
    // Enrich metadata via external APIs
    enrichTrackMetadata(currentTrack);
  }
  sendPresentationUpdate();
}
function onAudioPause(){
  state.isPlaying=false;
  document.querySelectorAll('[data-action="playpause"]').forEach(b=>b.innerHTML=ICONS.play);
  const wrap=document.getElementById('full-cover-wrap'); if(wrap) wrap.classList.remove('is-playing');
  if('mediaSession' in navigator) navigator.mediaSession.playbackState='paused';
  if(pipContainer&&pipContainer._playBtn) pipContainer._playBtn.innerHTML=ICONS.play;
  releaseWakeLock();
  broadcastSync('playpause',{isPlaying:false});
  saveMeta();
  sendPresentationUpdate();
}

  {id:'candy', name:'Candy Pop', css:'linear-gradient(135deg, #22d3ee 0%, #a78bfa 30%, #f472b6 60%, #fb923c 100%)'},
];

function applyBackground(bg){
  const body=document.body;
  body.classList.remove('custom-bg');
  body.style.backgroundImage='';
  body.style.backgroundColor='';
  if(!bg || bg.type==='default'){
    body.style.background='';
    body.style.backgroundImage='';
  } else if(bg.type==='premade'){
    const found=PREMADE_BGS.find(b=>b.id===bg.value);
    if(found){ body.style.backgroundImage=found.css; body.style.backgroundColor='#020617'; }
  } else if(bg.type==='custom'){
    body.classList.add('custom-bg');
    body.style.backgroundImage=`url("${bg.value}")`;
  }
  state.background=bg;
  try{ saveMeta(); }catch(e){}
}

function loadBackgroundFromMeta(meta){
  if(meta && meta.background){ applyBackground(meta.background); }
}

function setPremadeBg(id){
  applyBackground(id==='default'? {type:'default', value:'default'} : {type:'premade', value:id});
  document.querySelectorAll('.bg-thumb').forEach(el=>el.classList.toggle('active', el.dataset.bg===id));
}

function handleBgUpload(file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Please upload an image', 'error'); return; }
  const reader=new FileReader();
  reader.onload=e=>{
    applyBackground({type:'custom', value:e.target.result});
    showToast('Background updated!', 'success');
    document.querySelectorAll('.bg-thumb').forEach(el=>el.classList.remove('active'));
  };
  reader.readAsDataURL(file);
}


async function init(){
  // neon logo kept
  // document.getElementById('logo-icon').innerHTML=ICONS.music;
  document.getElementById('mini-shuffle-btn').innerHTML=ICONS.shuffle;
  document.getElementById('mini-repeat-btn').innerHTML=ICONS.repeat;
  document.querySelectorAll('[data-action="prev"]').forEach(b=>b.innerHTML=ICONS.prev);
  document.querySelectorAll('[data-action="next"]').forEach(b=>b.innerHTML=ICONS.next);
  document.querySelectorAll('[data-action="playpause"]').forEach(b=>b.innerHTML=ICONS.play);
  document.querySelectorAll('[data-action="close-full-player"]').forEach(b=>b.innerHTML=ICONS.chevronDown);
  document.querySelectorAll('[data-action="open-pip"]').forEach(b=>b.innerHTML=ICONS.pip);
  document.querySelectorAll('[data-action="open-cast"]').forEach(b=>b.innerHTML=ICONS.cast);
  document.querySelectorAll('[data-action="toggle-fullscreen"]').forEach(b=>b.innerHTML=ICONS.expand);
  document.querySelectorAll('[data-action="open-sound-settings"]').forEach(b=>b.innerHTML=ICONS.sliders);
  document.querySelectorAll('[data-action="seek-back-10"]').forEach(b=>b.innerHTML=ICONS.rewind10);
  document.querySelectorAll('[data-action="seek-fwd-10"]').forEach(b=>b.innerHTML=ICONS.forward10);
  document.getElementById('full-favorite').innerHTML=ICONS.heart;
  document.querySelector('[data-action="upload"]').innerHTML=ICONS.upload;
  document.querySelector('[data-action="open-theme"]').innerHTML=ICONS.palette;
  document.querySelector('[data-action="open-settings"]').innerHTML=ICONS.settings;
  document.querySelectorAll('.full-controls-main [data-action="toggle-shuffle"], .mini-controls [data-action="toggle-shuffle"]').forEach(b=>b.innerHTML=ICONS.shuffle);
  document.querySelectorAll('.full-controls-main [data-action="toggle-repeat"], .mini-controls [data-action="toggle-repeat"]').forEach(b=>b.innerHTML=ICONS.repeat);

  setupMediaSessionHandlers();
  setupPresentationApi();
  ensurePersistentStorage();
  setupWakeLockAuto();
  setupBroadcastChannel();
  setupFileHandling();
  refreshAudioOutputLabel();
  wireSeekInput(document.getElementById('mini-seek'),true);
  wireSeekInput(document.getElementById('full-seek'),false);
  document.getElementById('file-input').addEventListener('change',handleFileInputChange);
  document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>setView(btn.dataset.tab)));
  document.body.addEventListener('click',handleGlobalClick);
  document.getElementById('main-content').addEventListener('input',handleLibrarySearchInput);
  audioElAlt=document.createElement('audio');
  audioElAlt.id='audio-el-alt';
  audioElAlt.style.display='none';
  audioElAlt.preload='auto';
  document.body.appendChild(audioElAlt);
  [audioEl,audioElAlt].forEach(el=>{
    el.addEventListener('timeupdate',()=>{ if(el!==audioEl) return; updateProgressUI(audioEl.currentTime,audioEl.duration); updateMediaSessionPosition(); maybeStartCrossfade(); checkSleepTimer(); throttledPresentationSync(); });
    el.addEventListener('loadedmetadata',()=>{ if(el!==audioEl) return; updateProgressUI(audioEl.currentTime,audioEl.duration); });
    el.addEventListener('play',()=>{ if(el!==audioEl) return; onAudioPlay(); });
    el.addEventListener('pause',()=>{ if(el!==audioEl) return; onAudioPause(); });
    el.addEventListener('ended',()=>{ if(el!==audioEl) return; onAudioEnded(); });
  });

  const meta=await loadFromDB();
  setAccentColor((meta&&meta.accent)||state.accent,true);
  if(meta&&meta.selectedOutputId){ state.selectedOutputId=meta.selectedOutputId; selectedOutputDeviceId=meta.selectedOutputId; }
  if(meta&&meta.compressor){ state.compressor={...state.compressor, ...meta.compressor}; }
  if(meta&&meta.lyricsCache){ try{ state.lyricsCache=new Map(meta.lyricsCache); }catch(e){} }
  restorePlaybackState(meta);
  if(currentTrack) document.getElementById('mini-player').classList.remove('hidden');
  updateControlsUI();
  renderCurrentView();
  setInterval(()=>{ if(state.isPlaying) saveMeta(); },5000);

  if(navigator.mediaDevices&&navigator.mediaDevices.addEventListener) navigator.mediaDevices.addEventListener('devicechange',refreshAudioOutputLabel);
  tryAutoImportOnLoad();

  ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(evt=>document.addEventListener(evt,updateFullscreenUI));
  updateFullscreenUI();
}
init();
</script>
